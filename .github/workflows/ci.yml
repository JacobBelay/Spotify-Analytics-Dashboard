name: CI

# Run on every push to main and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Install Python and cache pip downloads between runs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Same CPU-only PyTorch install your Dockerfile uses
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Everything else from requirements.txt
      - run: pip install -r requirements.txt

      # Runs test_csv_import.py, test_forecast.py and test_trends.py
      - run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installs exactly what package-lock.json says
      - run: npm ci

      # Runs "tsc -b && vite build", so type errors fail the job
      - run: npm run build